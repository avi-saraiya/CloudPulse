# Runs CloudPulse + PostgreSQL on your machine:  docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudpulse
      POSTGRES_PASSWORD: postgres     # matches the default in application.properties

  app:
    build: .
    environment:
      # Containers reach each other by service name, so the database host is "postgres"
      DB_URL: jdbc:postgresql://postgres:5432/cloudpulse
    ports:
      - "8080:8080"
    restart: on-failure               # restarts the app if it starts before the database is ready
