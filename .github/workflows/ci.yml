# On every push to main: run the tests, build the image, deploy it to a throwaway kind cluster
# on the GitHub runner, and check that the API answers. Any failing step fails the run.
name: CI

on:
  push:
    branches: [main]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Test
        run: ./mvnw -B test

      - name: Build Docker image
        run: docker build -t cloudpulse:local .

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: cloudpulse

      - name: Deploy to kind
        run: |
          kind load docker-image cloudpulse:local --name cloudpulse
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/
          kubectl -n cloudpulse rollout status deployment/cloudpulse --timeout=300s

      - name: Check the API
        run: kubectl -n cloudpulse exec deployment/cloudpulse -- wget -qO- localhost:8080/api/services | grep "Payment API"
