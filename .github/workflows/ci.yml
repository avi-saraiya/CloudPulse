      #     docker tag cloudpulse:$IMAGE_TAG $ECR_URL:$IMAGE_TAG && docker push $ECR_URL:$IMAGE_TAG
      #     aws eks update-kubeconfig --region us-east-1 --name cloudpulse-eks
