# Grafana: charts from Prometheus. Login admin / admin.
# Grafana loads its data source and dashboard from files in /etc/grafana/provisioning when it starts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: cloudpulse
data:
  # Where Prometheus is
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus:9090
        isDefault: true
  # Load every dashboard .json file found in this folder
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: cloudpulse
        options:
          path: /etc/grafana/provisioning/dashboards
  # The dashboard: two charts, each with a PromQL query in "expr"
  cloudpulse.json: |
    {
      "title": "CloudPulse",
      "refresh": "5s",
      "panels": [
        { "type": "timeseries", "title": "Latency (ms)", "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [ { "expr": "cloudpulse_service_latency_ms", "legendFormat": "{{service}}" } ] },
        { "type": "timeseries", "title": "Error rate", "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [ { "expr": "cloudpulse_service_error_rate", "legendFormat": "{{service}}" } ] }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: cloudpulse
spec:
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:13.2.4
          volumeMounts:
            - name: config
              mountPath: /etc/grafana/provisioning
      volumes:
        - name: config
          configMap:
            name: grafana-config
            items:   # which ConfigMap key becomes which file
              - { key: datasources.yaml, path: datasources/datasources.yaml }
              - { key: dashboards.yaml, path: dashboards/dashboards.yaml }
              - { key: cloudpulse.json, path: dashboards/cloudpulse.json }
---
# Reach Grafana with `kubectl -n cloudpulse port-forward svc/grafana 3000:3000`
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: cloudpulse
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
