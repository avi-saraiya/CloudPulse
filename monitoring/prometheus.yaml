# Prometheus: every 5 seconds it scrapes http://cloudpulse:8080/actuator/prometheus and checks the alert rules.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cloudpulse
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    rule_files:
      - /etc/prometheus/alert-rules.yml
    scrape_configs:
      - job_name: cloudpulse
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["cloudpulse:8080"]

  # "for: 30s" = the condition must stay true for 30 seconds before the alert fires
  alert-rules.yml: |
    groups:
      - name: cloudpulse
        rules:
          - alert: CloudPulseHighLatency
            expr: cloudpulse_service_latency_ms > 1000
            for: 30s
          - alert: CloudPulseHighErrorRate
            expr: cloudpulse_service_error_rate > 0.10
            for: 30s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: cloudpulse
spec:
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.0
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus   # the two files from the ConfigMap above
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
# Lets Grafana reach Prometheus at http://prometheus:9090
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: cloudpulse
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
