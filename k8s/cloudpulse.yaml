# The CloudPulse app. One replica: the 5-second simulator runs inside it, so two would write every metric twice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpulse
  namespace: cloudpulse
spec:
  selector:
    matchLabels:
      app: cloudpulse
  template:
    metadata:
      labels:
        app: cloudpulse
    spec:
      containers:
        - name: cloudpulse
          image: cloudpulse:local          # built locally and copied in with `kind load docker-image`
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/cloudpulse
          # Ready once /actuator/health is UP (which includes the database), so `rollout status` waits for it
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
---
# Gives the app the address "cloudpulse:8080" inside the cluster. Reach it with `kubectl port-forward`.
apiVersion: v1
kind: Service
metadata:
  name: cloudpulse
  namespace: cloudpulse
spec:
  selector:
    app: cloudpulse
  ports:
    - port: 8080
