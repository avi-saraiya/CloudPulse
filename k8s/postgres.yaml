# PostgreSQL with no disk: the data lives inside the pod and is wiped when the pod restarts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: cloudpulse
spec:
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: cloudpulse
            - name: POSTGRES_PASSWORD
              value: postgres          # matches the default in application.properties
---
# Gives the database the address "postgres:5432" inside the cluster
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cloudpulse
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
