# AWS (EKS) ONLY: apply with `kubectl apply -f k8s/aws/`. Not used on kind, which has its own default disk type.
# A StorageClass tells Kubernetes HOW to create disks. Marking it as the default means the postgres-data
# PersistentVolumeClaim (which names no class) gets an AWS gp3 SSD volume created by the EBS CSI driver.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com          # the EBS CSI driver add-on installed by Terraform
parameters:
  type: gp3                            # general-purpose SSD
  encrypted: "true"                    # encrypt the disk at rest
volumeBindingMode: WaitForFirstConsumer # create the disk in the same zone as the pod that uses it
reclaimPolicy: Delete                  # delete the AWS disk when the claim is deleted (no orphaned costs)
