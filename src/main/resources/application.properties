# ${NAME:default} reads an environment variable, or uses the default when it is not set
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cloudpulse}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Run schema.sql and data.sql on every startup
spring.sql.init.mode=always

# /actuator/health for Kubernetes, /actuator/prometheus for Prometheus
management.endpoints.web.exposure.include=health,prometheus
