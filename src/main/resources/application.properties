spring.application.name=cloudpulse

# Database connection. The ${NAME:default} syntax reads an environment variable and falls back to the default.
# Docker Compose and Kubernetes set DB_URL / DB_USERNAME / DB_PASSWORD, so no real password lives in this file.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cloudpulse}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Error responses use the standard "Problem Details" JSON format, including a human-readable "detail" message
# (e.g. "Only OPEN incidents can be acknowledged") that the UI shows to the user.
spring.mvc.problemdetails.enabled=true

# Run schema.sql (create tables) and data.sql (seed services) on every startup. Both are safe to re-run.
spring.sql.init.mode=always

# Hibernate only checks that the entities match the tables; it never changes the schema itself.
spring.jpa.hibernate.ddl-auto=validate
# Store and read all timestamps in UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Off by default: the 5-second monitoring tick would flood the log with SQL. Set to true when debugging.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Actuator: expose ONLY the health check and the Prometheus metrics page.
#   /actuator/health      -> used by Docker/Kubernetes to see if the app is alive and ready
#   /actuator/prometheus  -> scraped by Prometheus every few seconds
management.endpoints.web.exposure.include=health,prometheus
# Adds /actuator/health/liveness and /actuator/health/readiness for the Kubernetes probes
management.endpoint.health.probes.enabled=true
# Readiness also checks the database, so Kubernetes stops sending traffic while the DB is unreachable.
# Liveness does NOT, so a database outage never makes Kubernetes restart the app in a loop.
management.endpoint.health.group.readiness.include=readinessState,db
# Record HTTP request durations as a histogram so Grafana can compute p95 latency
management.metrics.distribution.percentiles-histogram.http.server.requests=true
