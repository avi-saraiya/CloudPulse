# Test-only settings: replaces src/main/resources/application.properties when running `mvn test`.
# H2 is an in-memory database; MODE=PostgreSQL makes it understand our PostgreSQL schema.sql and data.sql.
spring.datasource.url=jdbc:h2:mem:cloudpulse;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
management.endpoints.web.exposure.include=health,prometheus
